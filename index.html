<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELYZAMA BRITT — Portfólio</title>
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #07080a;
            --bg-surface: #0e1017;
            --bg-card: #131620;
            --bg-glass: rgba(14, 16, 23, 0.85);
            
            --gold-primary: #d4af37;
            --gold-light: #f5e4a8;
            --gold-muted: rgba(212, 175, 55, 0.25);
            --gold-glow: rgba(212, 175, 55, 0.12);

            --rose-muted: rgba(158, 107, 114, 0.2);
            --rose-border: rgba(158, 107, 114, 0.25);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-tech: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.35);

            --font-heading: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

            --header-height: 80px;
            --container-max-width: 1140px;
        }

        html {
            scroll-behavior: smooth;
            font-family: var(--font-body);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(158, 107, 114, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 1.75rem;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-tech);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .brand-block {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-family: var(--font-heading);
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            text-decoration: none;
            line-height: 1.1;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 40%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.65rem;
            color: var(--gold-primary);
            letter-spacing: 0.12em;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 3px;
            opacity: 0.9;
        }

        .brand-location {
            font-size: 0.625rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-location::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--gold-primary);
            box-shadow: 0 0 8px var(--gold-primary);
        }

        .main-nav {
            display: flex;
            align-items: center;
        }

        .nav-list {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: color 0.2s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--gold-light);
        }

        .mobile-menu-btn {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-tech);
            color: var(--text-primary);
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .mobile-menu-btn:hover {
            border-color: var(--border-gold);
        }

        .main-content {
            margin-top: calc(var(--header-height) + 1.5rem);
            flex: 1;
            padding-bottom: 4rem;
            display: flex;
            flex-direction: column;
            gap: 3.5rem;
        }

        .section-block {
            border: 1px solid var(--border-tech);
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .section-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--gold-primary) 0%, transparent 100%);
            opacity: 0.4;
        }

        .section-header {
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.85rem;
        }

        .section-title-label {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--gold-primary);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .hero-layout {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 1rem 0;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 650px;
        }

        .hero-logo-wrapper {
            display: block;
            width: 100%;
            max-width: 380px;
            margin: 0.25rem 0;
        }

        .hero-logo-img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: contain;
            display: block;
            border-radius: 6px;
        }

        .hero-subtitle-main {
            font-family: var(--font-mono);
            font-size: clamp(0.85rem, 1.8vw, 1.1rem);
            color: var(--gold-primary);
            letter-spacing: 0.14em;
            font-weight: 700;
            text-transform: uppercase;
            border-left: 2px solid var(--gold-primary);
            padding-left: 0.85rem;
        }

        .hero-location-tag {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .hero-actions {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.95rem 2rem;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 0.825rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--gold-glow);
        }

        .cta-button:hover {
            background: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .apresentacao-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2.5rem;
            align-items: flex-start;
        }

        .apresentacao-video-container {
            width: 100%;
            max-width: 320px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.15);
            background: var(--bg-card);
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            position: relative;
        }

        .apresentacao-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .apresentacao-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.75rem;
        }

        .apresentacao-text {
            color: var(--text-secondary);
            font-size: clamp(0.9rem, 1.2vw, 1.025rem);
            line-height: 1.75;
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
        }

        .apresentacao-text p {
            margin: 0;
        }

        .apresentacao-pillars {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .pillar-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-tech);
            padding: 1.1rem 1.35rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .pillar-card:hover {
            border-color: var(--border-gold);
            background: rgba(212, 175, 55, 0.03);
            transform: translateX(4px);
        }

        .pillar-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--gold-light);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .carro-chefe-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 0;
            width: 100%;
        }

        .carro-chefe-video-wrapper {
            width: 100%;
            max-width: 380px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.18);
            background: var(--bg-card);
            aspect-ratio: 9 / 16;
            position: relative;
            margin: 0 auto;
        }

        .carro-chefe-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .projetos-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2rem;
        }

        .projeto-card-slot {
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: border-color 0.3s ease;
        }

        .projeto-card-slot:hover {
            border-color: rgba(212, 175, 55, 0.3);
        }

        .span-12 { grid-column: span 12; }
        .span-6  { grid-column: span 6; }

        .projeto-miniaturas-media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.75rem;
            align-items: center;
            width: 100%;
        }

        .projeto-media-box {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .projeto-media-frame {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            background: var(--bg-surface);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            aspect-ratio: 9 / 16;
            max-height: 480px;
            margin: 0 auto;
            position: relative;
        }

        .projeto-img-element,
        .projeto-video-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .k-alves-header {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1.25rem;
        }

        .k-alves-title {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--gold-light);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .k-alves-subtitle {
            font-size: 0.88rem;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .k-alves-tag {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--gold-primary);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .k-alves-media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin: 0.5rem 0;
        }

        .k-alves-media-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .k-alves-media-title {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--gold-light);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: center;
            font-weight: 700;
        }

        .k-alves-media-frame {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            background: var(--bg-surface);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            aspect-ratio: 9 / 16;
            max-height: 480px;
            margin: 0 auto;
            position: relative;
        }

        .k-alves-media-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .k-alves-action {
            display: flex;
            justify-content: flex-start;
            margin-top: 0.5rem;
        }

        .k-alves-comentario-wrapper {
            border-top: 1px dashed var(--border-gold);
            padding-top: 1.5rem;
            margin-top: 0.5rem;
        }

        .k-alves-comentario-card {
            background: rgba(212, 175, 55, 0.03);
            border: 1px solid var(--border-tech);
            border-left: 3px solid var(--gold-primary);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .k-alves-comentario-title {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--gold-primary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .k-alves-comentario-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0;
        }

        .dois-lados-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1.25rem;
