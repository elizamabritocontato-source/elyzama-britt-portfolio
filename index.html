<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ELYZAMA BRITT — Portfólio</title>
    <meta name="description" content="Elyzama Britt — Comunicação, Inteligência Artificial e Conteúdo Digital. Portfólio profissional em Salvador, Bahia.">

    <style>
        /* =========================================================
           ELYZAMA BRITT — PORTFÓLIO
           Interface: tecnologia sofisticada / editorial / futurista
           Sem dependências externas
        ========================================================= */

        :root {
            --black: #050609;
            --black-2: #080a0f;
            --graphite: #0d1017;
            --graphite-2: #121722;
            --glass: rgba(14, 17, 25, .72);

            --white: #f5f5f2;
            --ice: #d8dce3;
            --muted: #9ba3b1;
            --muted-2: #697282;

            --gold: #d5b65a;
            --gold-light: #f0dda0;
            --gold-soft: rgba(213, 182, 90, .18);
            --gold-line: rgba(213, 182, 90, .38);

            --rose: #9d6b73;
            --rose-soft: rgba(157, 107, 115, .16);

            --violet: #665b86;
            --violet-soft: rgba(102, 91, 134, .15);

            --line: rgba(255,255,255,.09);
            --line-strong: rgba(255,255,255,.15);

            --radius: 24px;
            --radius-small: 14px;

            --max: 1240px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background: var(--black);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 8%, rgba(213,182,90,.10), transparent 28%),
                radial-gradient(circle at 88% 16%, rgba(102,91,134,.13), transparent 30%),
                radial-gradient(circle at 55% 70%, rgba(157,107,115,.07), transparent 34%),
                linear-gradient(135deg, #050609 0%, #080a0f 48%, #06070b 100%);
            color: var(--white);
            font-family:
                Inter,
                ui-sans-serif,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: .32;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: linear-gradient(to bottom, black, transparent 90%);
            -webkit-mask-image: linear-gradient(to bottom, black, transparent 90%);
        }

        a {
            color: inherit;
        }

        img,
        video {
            max-width: 100%;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: min(100% - 40px, var(--max));
            margin-inline: auto;
        }

        /* =========================================================
           ELEMENTOS TECNOLÓGICOS DE FUNDO
        ========================================================= */

        .tech-orbit {
            position: absolute;
            border: 1px solid rgba(213,182,90,.22);
            border-radius: 50%;
            pointer-events: none;
        }

        .tech-orbit::before,
        .tech-orbit::after {
            content: "";
            position: absolute;
            border-radius: 50%;
        }

        .tech-orbit::before {
            inset: 12%;
            border: 1px solid rgba(255,255,255,.07);
        }

        .tech-orbit::after {
            width: 8px;
            height: 8px;
            top: 7%;
            left: 17%;
            background: var(--gold-light);
            box-shadow:
                0 0 12px var(--gold),
                0 0 28px rgba(213,182,90,.55);
        }

        .tech-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .45;
            background:
                linear-gradient(rgba(213,182,90,.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(213,182,90,.055) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at center, black 10%, transparent 76%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 76%);
        }

        .tech-node {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold-light);
            box-shadow: 0 0 14px rgba(213,182,90,.75);
        }

        .tech-line {
            position: absolute;
            height: 1px;
            transform-origin: left center;
            background: linear-gradient(
                90deg,
                rgba(213,182,90,.65),
                rgba(213,182,90,.08),
                transparent
            );
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(213,182,90,.45),
                transparent
            );
            box-shadow: 0 0 12px rgba(213,182,90,.2);
            animation: scan 7s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            from {
                top: 5%;
            }
            to {
                top: 95%;
            }
        }

        .glow-orb {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(213,182,90,.12),
                rgba(213,182,90,.035) 38%,
                transparent 70%
            );
            filter: blur(8px);
            pointer-events: none;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .site-header {
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            border-bottom: 1px solid rgba(255,255,255,.07);
            background: rgba(5,6,9,.72);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .header-inner {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand-block {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            min-width: 0;
        }

        .brand-name {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: .17em;
            color: var(--white);
            text-decoration: none;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: var(--gold);
            font-size: .58rem;
            font-weight: 700;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        .brand-location {
            margin-top: 2px;
            color: var(--muted-2);
            font-size: .58rem;
            letter-spacing: .05em;
        }

        .main-nav {
            display: block;
        }

        .nav-list {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-link {
            position: relative;
            text-decoration: none;
            color: var(--muted);
            font-size: .67rem;
            font-weight: 650;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition: color .25s ease;
            white-space: nowrap;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -7px;
            width: 0;
            height: 1px;
            background: var(--gold);
            box-shadow: 0 0 8px rgba(213,182,90,.55);
            transition: width .25s ease;
        }

        .nav-link:hover {
            color: var(--white);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            width: 44px;
            height: 44px;
            border: 1px solid var(--line-strong);
            border-radius: 12px;
            background: rgba(255,255,255,.035);
            color: var(--white);
            cursor: pointer;
        }

        /* =========================================================
           MAIN / SECTIONS
        ========================================================= */

        main {
            padding-top: 108px;
            padding-bottom: 70px;
        }

        .section {
            position: relative;
            margin-bottom: 34px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.012) 50%,
                    rgba(213,182,90,.018)
                );
            box-shadow:
                0 30px 80px rgba(0,0,0,.26),
                inset 0 1px 0 rgba(255,255,255,.035);
        }

        .section::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            top: -240px;
            right: -180px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(213,182,90,.07),
                transparent 68%
            );
            pointer-events: none;
        }

        .section-inner {
            position: relative;
            z-index: 2;
            padding: 58px;
        }

        .section-kicker {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            color: var(--gold);
            font-size: .68rem;
            font-weight: 750;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .section-kicker::before {
            content: "";
            width: 30px;
            height: 1px;
            background: var(--gold);
            box-shadow: 0 0 10px rgba(213,182,90,.5);
        }

        .section-number {
            margin-left: auto;
            color: var(--muted-2);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .6rem;
            letter-spacing: .12em;
        }

        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            min-height: calc(100vh - 130px);
            display: flex;
            align-items: center;
        }

        .hero .section-inner {
            width: 100%;
            min-height: calc(100vh - 130px);
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(390px, .95fr);
            align-items: center;
            gap: 55px;
            padding-top: 72px;
            padding-bottom: 72px;
        }

        .hero-copy {
            position: relative;
            z-index: 3;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 13px;
            margin-bottom: 28px;
            border: 1px solid rgba(213,182,90,.28);
            border-radius: 999px;
            background: rgba(213,182,90,.055);
            color: var(--gold-light);
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .hero-eyebrow::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
        }

        .hero-logo-frame {
            width: min(100%, 570px);
            margin-bottom: 25px;
        }

        .hero-logo-frame img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            object-position: left center;
            border-radius: 12px;
        }

        .hero-subtitle {
            max-width: 660px;
            color: var(--ice);
            font-size: clamp(1rem, 2vw, 1.28rem);
            font-weight: 650;
            letter-spacing: .14em;
            line-height: 1.45;
            text-transform: uppercase;
        }

        .hero-location {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 20px;
            color: var(--muted);
            font-size: .82rem;
        }

        .hero-location svg {
            color: var(--gold);
        }

        .hero-actions {
            margin-top: 35px;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            min-height: 50px;
            padding: 0 22px;
            border: 1px solid var(--gold-line);
            border-radius: 10px;
            background:
                linear-gradient(
                    135deg,
                    rgba(213,182,90,.18),
                    rgba(213,182,90,.055)
                );
            color: var(--gold-light);
            text-decoration: none;
            font-size: .72rem;
            font-weight: 750;
            letter-spacing: .12em;
            text-transform: uppercase;
            box-shadow:
                0 12px 35px rgba(0,0,0,.22),
                0 0 25px rgba(213,182,90,.06);
            transition: transform .25s ease, background .25s ease, border-color .25s ease;
        }

        .cta:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            background: rgba(213,182,90,.22);
        }

        .cta svg {
            transition: transform .25s ease;
        }

        .cta:hover svg {
            transform: translateX(4px);
        }

        /* HERO TECH VISUAL */

        .hero-visual {
            position: relative;
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-visual::before {
            content: "";
            position: absolute;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(213,182,90,.11) 0%,
                    rgba(102,91,134,.08) 35%,
                    transparent 70%
                );
            filter: blur(8px);
        }

        .interface-core {
            position: relative;
            width: min(100%, 460px);
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(213,182,90,.24);
            border-radius: 50%;
            background:
                radial-gradient(circle at center,
                    rgba(213,182,90,.08),
                    rgba(8,10,15,.30) 38%,
                    transparent 70%);
            box-shadow:
                0 0 80px rgba(213,182,90,.07),
                inset 0 0 50px rgba(213,182,90,.04);
        }

        .interface-core::before {
            content: "";
            position: absolute;
            inset: 9%;
            border: 1px solid rgba(255,255,255,.11);
            border-radius: 50%;
            transform: rotate(-16deg);
        }

        .interface-core::after {
            content: "";
            position: absolute;
            inset: 21%;
            border: 1px dashed rgba(213,182,90,.28);
            border-radius: 50%;
        }

        .orbit-one {
            width: 84%;
            height: 35%;
            border: 1px solid rgba(213,182,90,.25);
            border-radius: 50%;
            position: absolute;
            left: 8%;
            top: 32%;
            transform: rotate(27deg);
        }

        .orbit-two {
            width: 35%;
            height: 84%;
            border: 1px solid rgba(157,107,115,.26);
            border-radius: 50%;
            position: absolute;
            left: 32%;
            top: 8%;
            transform: rotate(-24deg);
        }

        .core-center {
            position: absolute;
            width: 105px;
            height: 105px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(213,182,90,.55);
            background:
                radial-gradient(circle,
                    rgba(213,182,90,.25),
                    rgba(13,16,23,.85) 65%);
            box-shadow:
                0 0 30px rgba(213,182,90,.18),
                inset 0 0 25px rgba(213,182,90,.1);
        }

        .core-center span {
            color: var(--gold-light);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .66rem;
            font-weight: 700;
            letter-spacing: .15em;
            text-align: center;
        }

        .interface-label {
            position: absolute;
            padding: 8px 11px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 8px;
            background: rgba(5,6,9,.72);
            backdrop-filter: blur(12px);
            color: var(--ice);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .58rem;
            letter-spacing: .08em;
            box-shadow: 0 12px 30px rgba(0,0,0,.25);
        }

        .label-1 {
            top: 13%;
            right: 7%;
        }

        .label-2 {
            left: 3%;
            top: 45%;
        }

        .label-3 {
            bottom: 14%;
            right: 10%;
        }

        .interface-dot {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold-light);
            box-shadow: 0 0 14px var(--gold);
        }

        .dot-1 { top: 18%; left: 26%; }
        .dot-2 { top: 67%; left: 14%; }
        .dot-3 { bottom: 18%; right: 27%; }
        .dot-4 { top: 35%; right: 14%; }

        .hero-data-panel {
            position: absolute;
            bottom: 3%;
            left: 5%;
            width: 190px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 12px;
            background: rgba(7,8,12,.75);
            backdrop-filter: blur(14px);
        }

        .data-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .52rem;
        }

        .data-line:last-child {
            margin-bottom: 0;
        }

        .data-line strong {
            color: var(--gold-light);
            font-weight: 600;
        }

        /* =========================================================
           APRESENTAÇÃO
        ========================================================= */

        .presentation-grid {
            display: grid;
            grid-template-columns: minmax(260px, 370px) minmax(0, 1fr);
            gap: 58px;
            align-items: center;
        }

        .media-shell {
            position: relative;
            padding: 10px;
            border: 1px solid rgba(213,182,90,.25);
            border-radius: 20px;
            background:
                linear-gradient(135deg,
                    rgba(213,182,90,.08),
                    rgba(255,255,255,.025));
            box-shadow:
                0 28px 70px rgba(0,0,0,.4),
                0 0 35px rgba(213,182,90,.05);
        }

        .media-shell::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            top: -18px;
            right: -18px;
            border-top: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
            border-radius: 0 18px 0 0;
            opacity: .7;
        }

        .presentation-video {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            border-radius: 13px;
            background: #020306;
        }

        .presentation-copy {
            max-width: 700px;
        }

        .presentation-copy h2 {
            margin-bottom: 20px;
            font-size: clamp(1.6rem, 3vw, 2.5rem);
            line-height: 1.08;
            letter-spacing: -.025em;
        }

        .presentation-copy h2 span {
            color: var(--gold-light);
        }

        .presentation-text {
            display: grid;
            gap: 17px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.82;
        }

        .pillars {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .pillar {
            min-height: 108px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: rgba(255,255,255,.025);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            transition: transform .25s ease, border-color .25s ease;
        }

        .pillar:hover {
            transform: translateY(-4px);
            border-color: var(--gold-line);
        }

        .pillar-icon {
            color: var(--gold);
        }

        .pillar strong {
            color: var(--ice);
            font-size: .7rem;
            letter-spacing: .08em;
            line-height: 1.4;
        }

        /* =========================================================
           CARRO-CHEFE
        ========================================================= */

        .featured {
            text-align: center;
        }

        .featured-intro {
            max-width: 700px;
            margin: -5px auto 35px;
            color: var(--muted);
            font-size: .95rem;
        }

        .featured-stage {
            position: relative;
            width: min(100%, 650px);
            margin: 0 auto;
        }

        .featured-stage::before {
            content: "";
            position: absolute;
            inset: -50px;
            border-radius: 50%;
            background:
                radial-gradient(circle,
                    rgba(213,182,90,.12),
                    rgba(102,91,134,.06) 42%,
                    transparent 70%);
            filter: blur(12px);
            pointer-events: none;
        }

        .featured-stage::after {
            content: "";
            position: absolute;
            inset: 10px -22px;
            border: 1px solid rgba(213,182,90,.12);
            border-radius: 28px;
            transform: rotate(1.5deg);
            pointer-events: none;
        }

        .featured-video-shell {
            position: relative;
            z-index: 2;
            width: min(100%, 540px);
            margin: auto;
            padding: 10px;
            border: 1px solid var(--gold-line);
            border-radius: 22px;
            background: rgba(5,6,9,.78);
            box-shadow:
                0 35px 90px rgba(0,0,0,.5),
                0 0 50px rgba(213,182,90,.08);
        }

        .featured-video {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            border-radius: 14px;
            background: #020306;
        }

        .featured-meta {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .meta-chip {
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            background: rgba(255,255,255,.025);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .57rem;
            letter-spacing: .07em;
            text-transform: uppercase;
        }

        /* =========================================================
           PROJETOS
        ========================================================= */

        .projects {
            display: grid;
            gap: 28px;
        }

        .project {
            position: relative;
            padding: 38px;
            border: 1px solid var(--line);
            border-radius: 21px;
            background:
                linear-gradient(135deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.012));
            overflow: hidden;
        }

        .project::after {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            right: -130px;
            bottom: -130px;
            border-radius: 50%;
            border: 1px solid rgba(213,182,90,.12);
            pointer-events: none;
        }

        .project-header {
            position: relative;
            z-index: 2;
            margin-bottom: 28px;
        }

        .project-index {
            display: block;
            margin-bottom: 7px;
            color: var(--gold);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .59rem;
            letter-spacing: .13em;
        }

        .project-title {
            font-size: clamp(1.35rem, 2.6vw, 2rem);
            line-height: 1.1;
            letter-spacing: -.02em;
        }

        .project-subtitle {
